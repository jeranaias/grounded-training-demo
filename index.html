<style>
:root{
  --void:#e9eff8;--void-deep:#dde6f2;--surface:rgba(255,255,255,.74);--surface-2:rgba(255,255,255,.52);
  --border:rgba(40,72,140,.14);--border-lit:rgba(11,160,145,.42);--text:#37415a;--dim:#6b7690;--bright:#0f1729;--faint:#9aa4bd;
  --glow:#0a9c8d;--glow-2:#4f6fe0;--glow-soft:rgba(11,160,145,.15);--readout:#b15e10;--danger:#cf3f3f;
  --mote1:rgba(11,160,145,.16);--mote2:rgba(79,111,224,.14);--lift:0 2px 10px rgba(40,72,140,.08);--track:rgba(40,72,140,.1);
  --sans:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --void:#05060b;--void-deep:#020208;--surface:rgba(16,20,36,.55);--surface-2:rgba(22,28,48,.5);

  --mote1:rgba(110,242,224,.2);--mote2:rgba(138,162,255,.18);--lift:0 4px 18px rgba(0,0,0,.4);--track:rgba(2,4,10,.6);
}}
:root[data-theme=dark]{
  --void:#05060b;--void-deep:#020208;--surface:rgba(16,20,36,.55);--surface-2:rgba(22,28,48,.5);
  --border:rgba(120,150,220,.14);--border-lit:rgba(110,242,224,.35);--text:#cbd3e6;--dim:#7c86a3;--bright:#f4f7ff;--faint:#59627e;
  --glow:#6ef2e0;--glow-2:#8aa2ff;--glow-soft:rgba(110,242,224,.16);--readout:#ffb673;--danger:#ff8a8a;
  --mote1:rgba(110,242,224,.2);--mote2:rgba(138,162,255,.18);--lift:0 4px 18px rgba(0,0,0,.4);--track:rgba(2,4,10,.6);

*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(120% 80% at 50% -10%,var(--mote1),transparent 55%),radial-gradient(90% 60% at 100% 110%,var(--mote2),transparent 55%),var(--void-deep);
  color:var(--text);font-family:var(--sans);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--readout)}
.top{display:flex;align-items:center;gap:16px;height:56px;padding:0 22px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,color-mix(in srgb,var(--void) 82%,transparent),transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{font-weight:900;font-size:18px;color:var(--bright);letter-spacing:-.02em}
.gp{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
.gp .n{width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow);animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes bloom{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
nav{margin-left:auto;display:flex;gap:5px;align-items:center}
nav .tab{background:none;border:none;color:var(--dim);font-family:var(--sans);font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.18s}
nav .tab:hover{color:var(--text)}nav .tab.on{color:var(--void);background:var(--glow);box-shadow:0 0 22px var(--glow-soft)}
.theme{background:none;border:1px solid var(--border);color:var(--dim);border-radius:9px;width:32px;height:32px;font-size:14px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:26px 22px 80px}
.view{animation:bloom .4s both}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
h1{font-size:25px;color:var(--bright);letter-spacing:-.02em;margin:0 0 4px;font-weight:800}
.sub{color:var(--dim);font-size:14px;margin:0 0 20px;max-width:64ch}
.banner{background:color-mix(in srgb,var(--glow) 8%,var(--surface));border:1px solid var(--border-lit);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--dim);margin-bottom:18px}
.banner b{color:var(--bright)}
/* studio */
.label{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:2px 0 8px}
textarea,.fakefile{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:12px 15px;color:var(--text);font-family:var(--mono);font-size:12.5px;line-height:1.55;outline:none;resize:vertical}
.fakefile{display:flex;align-items:center;gap:10px;color:var(--dim);cursor:default;font-family:var(--sans)}
.chip2{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:12px;color:var(--text)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.btn{background:linear-gradient(180deg,var(--glow),color-mix(in srgb,var(--glow) 70%,#000));color:var(--void);border:none;border-radius:12px;padding:10px 17px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 0 24px var(--glow-soft)}
.btn:hover{filter:brightness(1.07)}.btn.ghost{background:none;color:var(--glow);border:1px solid var(--border-lit);box-shadow:none}.btn.sm{padding:7px 13px;font-size:13px}.btn[disabled]{opacity:.5;cursor:default}
.status{font-size:12.5px;color:var(--dim)}
.genlog{margin-top:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:14px 16px;font-family:var(--mono);font-size:12.5px;max-height:340px;overflow:auto}
.genline{padding:2px 0;white-space:pre-wrap}.genline.dim{color:var(--dim)}.genline.sec{color:var(--bright);font-weight:700;margin-top:6px}.genline.ok{color:var(--glow)}.genline.warn{color:var(--readout)}.genline.done{color:var(--glow);font-weight:700;margin-top:8px}
/* course tiles */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 24px;margin-bottom:18px;backdrop-filter:blur(10px);box-shadow:var(--lift)}
.hero .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--glow);background:var(--glow-soft);border:1px solid var(--border-lit);border-radius:999px;padding:4px 11px;margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;backdrop-filter:blur(10px);box-shadow:var(--lift);cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.tile:hover{border-color:var(--border-lit);transform:translateY(-2px)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--glow),transparent);box-shadow:0 0 14px var(--glow);opacity:.9}
.tile .tk{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tile h3{font-size:16px;color:var(--bright);margin:3px 0 8px;font-weight:700}.tile .meta{font-size:13px;color:var(--dim)}
/* org / cards */
.back{background:none;border:none;color:var(--glow);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
.org{padding:16px 18px;border-radius:15px;background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden;backdrop-filter:blur(10px);box-shadow:var(--lift);margin-bottom:12px;animation:bloom .4s both}
.org::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--glow),transparent);box-shadow:0 0 14px var(--glow);opacity:.9}
.org p{margin:0 0 8px;color:var(--text);font-size:14.5px}
.cite{font-family:var(--mono);font-size:11px;color:var(--glow);border:1px solid var(--border-lit);border-radius:6px;padding:1px 7px;white-space:nowrap}
.meta{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.nucleus{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow);animation:pulse 2.4s infinite;display:inline-block}
.srcline{margin-top:8px;font-size:12px;color:var(--dim);font-family:var(--mono)}
.diagram{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:15px 17px;margin-bottom:12px;backdrop-filter:blur(10px);box-shadow:var(--lift);position:relative;overflow:hidden}
.diagram::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--glow),transparent);box-shadow:0 0 14px var(--glow);opacity:.9}
.diagram h4{margin:0 0 3px;font-size:14.5px;color:var(--bright);font-weight:700}.dcap{font-size:12px;color:var(--dim);margin:0 0 12px}
.diagram svg{width:100%;max-width:360px;height:auto;display:block;margin:2px auto 6px}
.railh{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--glow)}
.qopts{display:grid;gap:6px;margin:8px 0}
.qopt{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--text);background:var(--surface-2)}
.qopt.correct{border-color:var(--border-lit);background:var(--glow-soft);color:var(--bright)}.qlt{font-family:var(--mono);color:var(--dim);font-size:12px}
.fcgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.fc{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:14px 16px}
.fcq{font-size:13.5px;font-weight:700;color:var(--bright);margin-bottom:6px}.fca{font-size:13px;color:var(--dim)}
/* review controls */
.review{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.rbtns,.rrevise{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rb{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:9px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:.15s}
.rb:hover{border-color:var(--border-lit)}.rb.ok{color:var(--glow);border-color:var(--border-lit)}.rb.no{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.rmsg{font-size:12px;color:var(--glow)}.rrev{font-family:var(--mono);font-size:11px;color:var(--readout)}
.rinput{flex:1;min-width:240px;background:var(--surface-2);border:1px solid var(--border-lit);border-radius:9px;padding:7px 11px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none}
.approved{opacity:.72}.rejected{opacity:.4}
.note{color:var(--dim);font-size:12.5px;margin-top:16px}
@media(max-width:680px){.tiles,.fcgrid{grid-template-columns:1fr}}
</style>
</head>

          "id": "cmtw175ta005hqj64hp87pf76",
          "stem": "Mastering your aim requires understanding three distinct components: sight alignment, which is the physical alignment of your aiming device; sight picture, the placement of those aligned sights on the target; and the desired point of impact, where you actually want the round to strike. These elements are critical because at any range different from your zero, your point of aim and desired point of impact will not align, requiring you to calculate a specific hold-off. A common error occurs when shooters fail to focus on the front sight post or reticle, leading to incorrect sight alignment. To correct this, you must maintain sight alignment throughout the entire positioning of the sights on the target. Remember: sight alignment is the first and most important part of the aiming process. Coaching cue: Focus on the reticle, not the target.",

var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
$('#tg').onclick=function(){var r=document.documentElement,c=r.getAttribute('data-theme');if(!c)c=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';r.setAttribute('data-theme',c==='dark'?'light':'dark');};
var COL={dim:'var(--dim)',glow:'var(--glow)',glow2:'var(--glow-2)',danger:'var(--danger)',readout:'var(--readout)',none:'none'};
function col(c){return COL[c]||c||'none';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function svgSpec(spec){
  if(!spec||!spec.elements)return '';
  var parts=spec.elements.map(function(e){
    if(e.type==='circle')return '<circle cx="'+e.cx+'" cy="'+e.cy+'" r="'+e.r+'" stroke="'+col(e.stroke)+'" fill="'+col(e.fill)+'" stroke-width="2"/>';
    if(e.type==='rect')return '<rect x="'+e.x+'" y="'+e.y+'" width="'+e.w+'" height="'+e.h+'" fill="'+col(e.fill)+'" stroke="'+col(e.stroke)+'"/>';
    if(e.type==='line')return '<line x1="'+e.x1+'" y1="'+e.y1+'" x2="'+e.x2+'" y2="'+e.y2+'" stroke="'+col(e.stroke)+'" stroke-width="1.5"/>';
    if(e.type==='text')return '<text x="'+e.x+'" y="'+e.y+'" fill="var(--dim)" font-size="10" font-family="monospace">'+esc(e.text)+'</text>';
    return '';
  }).join('');
  return '<svg viewBox="'+(spec.viewBox||'0 0 340 200')+'" role="img">'+parts+'</svg>';
}
/* review controls (visual) */
function review(id){return '<div class="review" data-r="'+id+'"><div class="rbtns">'+
  '<button class="rb ok" onclick="rApprove(this)">✓ Approve</button>'+
  '<button class="rb" onclick="rOpen(this)">✎ Revise</button>'+
  '<button class="rb no" onclick="rReject(this)">✕ Reject</button></div></div>';}
window.rApprove=function(b){var w=b.closest('[data-r]');w.innerHTML='<span class="rmsg">✓ Approved</span>';w.closest('.org,.fc,.diagram').classList.add('approved');};
window.rReject=function(b){var w=b.closest('[data-r]');w.innerHTML='<span class="rmsg" style="color:var(--danger)">✕ Rejected</span>';w.closest('.org,.fc,.diagram').classList.add('rejected');};
window.rOpen=function(b){var w=b.closest('[data-r]');w.querySelector('.rbtns').style.display='none';
  var d=document.createElement('div');d.className='rrevise';d.innerHTML='<input class="rinput" placeholder="What should the AI fix? (stays grounded in the source)"><button class="rb ok" onclick="rSend(this)">Send to AI</button><button class="rb" onclick="rCancel(this)">Cancel</button>';w.appendChild(d);d.querySelector('input').focus();};
window.rCancel=function(b){var w=b.closest('[data-r]');w.querySelector('.rrevise').remove();w.querySelector('.rbtns').style.display='';};
window.rSend=function(b){var w=b.closest('[data-r]');var note=w.querySelector('input').value||'polish';w.innerHTML='<span class="rmsg">◍ AI polishing…</span>';
  setTimeout(function(){w.innerHTML='<div class="rbtns"><span class="rrev">rev 1</span><span class="rmsg">Revised ✓ — grounded in the source</span><button class="rb ok" onclick="rApprove(this)">✓ Approve</button></div>';},reduce?0:900);};

/* views */
function setView(v,sec){
  $$('nav .tab').forEach(function(t){t.classList.toggle('on',t.dataset.v===v);});
  if(v==='studio')renderStudio();else if(v==='course')renderCourse();else if(v==='lesson')renderLesson(sec);
  window.scrollTo(0,0);
}
function renderStudio(){
  $('#stage').innerHTML='<div class="view"><div class="eyebrow">Instructor · Content Generation</div>'+
   '<h1>Studio</h1><p class="sub">Attach the source doctrine and a Program of Instruction. Generate a complete, grounded course — cited lessons, diagrams, pre/post tests, flashcards — all left pending your review.</p>'+
   '<div class="label">1 · Source corpus</div><div class="fakefile"><span class="chip2">📄 TC 3-22.9 (Rifle and Carbine).pdf</span> <b style="color:var(--glow)">182 chunks indexed</b> · coordinate-aware extraction</div>'+
   '<div class="label" style="margin-top:16px">2 · Program of Instruction</div>'+
   '<textarea rows="7" spellcheck="false">PROGRAM OF INSTRUCTION — Rifle &amp; Carbine Marksmanship (TC 3-22.9)\nEnabling Learning Objectives:\n'+COURSE.sections.map(function(s,i){return '  '+(i+1)+'. '+esc(s.title.replace(/^Obj \d+ · /,''));}).join('\n')+'</textarea>'+
   '<div class="toolbar"><button class="btn" id="gen">Generate course</button><span class="status">Grounded, cited, PENDING your review — nothing reaches a student until you approve it.</span></div>'+
   '<div id="genlog"></div></div>';
  $('#gen').onclick=runGen;
}
function runGen(){
  var log=$('#genlog');log.className='genlog';log.innerHTML='';
  var evs=[['Job started — generating in the background (finishes even if you leave).','dim'],['Parsing the POI…',''],['Found '+COURSE.sections.length+' objectives.','dim'],['Grounding against your attached corpus (182 chunks).','dim']];
  COURSE.sections.forEach(function(s){evs.push(['▸ '+s.title,'sec']);
    if(s.lessons.length)evs.push(['    ✓ lesson','ok']);
    evs.push([s.diagram?'    ✓ diagram':'    — diagram (not supported by the passage)',s.diagram?'ok':'warn']);
    evs.push(['    ✓ pre-test ×'+s.pre.length,'ok']);evs.push(['    ✓ post-test ×'+s.post.length,'ok']);evs.push(['    ✓ flashcards ×'+s.flashcards.length,'ok']);});
  evs.push(['✓ Course generated — all items are PENDING your review.','done']);
  $('#gen').disabled=true;var i=0;
  (function step(){if(i>=evs.length){$('#gen').disabled=false;var b=document.createElement('button');b.className='btn ghost';b.style.marginTop='12px';b.textContent='Review the course →';b.onclick=function(){setView('course');};log.appendChild(b);return;}
    var d=document.createElement('div');d.className='genline '+evs[i][1];d.textContent=evs[i][0];log.appendChild(d);log.scrollTop=log.scrollHeight;i++;setTimeout(step,reduce?0:evs[i-1][0][0]==='▸'?220:120);})();
}
function renderCourse(){
  var items=COURSE.sections.reduce(function(n,s){return n+s.lessons.length+(s.diagram?1:0)+s.pre.length+s.post.length+s.flashcards.length;},0);
  var h='<div class="view"><div class="eyebrow">Program of Instruction · generated · grounded</div>'+
   '<div class="hero"><div class="k">Sourced from '+esc(COURSE.course.sourceId)+' · AI-generated · pending review</div><h1>Rifle Marksmanship</h1>'+
   '<p class="sub" style="margin:6px 0 0">Generated from a POI, grounded in the manual, fact-checked. <span class="num">'+COURSE.sections.length+'</span> chapters · <span class="num">'+items+'</span> items.</p>'+
   '<div class="badge"><span class="n"></span> attach doctrine + POI → grounded course → instructor review</div></div><div class="tiles">';
  COURSE.sections.forEach(function(s,i){var c=s.lessons.length+(s.diagram?1:0)+s.pre.length+s.post.length+s.flashcards.length;
    h+='<div class="tile" data-i="'+i+'"><div class="tk">'+esc(s.title.split(' · ')[0])+'</div><h3>'+esc(s.title.split(' · ')[1]||s.title)+'</h3>'+
       '<div class="meta"><span class="num">'+c+'</span> items · pending review</div>'+
       (s.lessons[0]?'<p class="meta" style="margin-top:8px;color:var(--text)">'+esc(s.lessons[0].stem.slice(0,90))+'…</p>':'')+'</div>';});
  h+='</div></div>';
  $('#stage').innerHTML=h;
  $$('.tile').forEach(function(t){t.onclick=function(){setView('lesson',+t.dataset.i);};});
}
function renderLesson(i){
  var s=COURSE.sections[i];var n=0;
  var h='<div class="view"><button class="back" id="bk">← Course</button><div class="eyebrow">'+esc(s.title.split(' · ')[0])+' · generated · pending review</div>'+
   '<h1>'+esc(s.title.split(' · ')[1]||s.title)+'</h1>'+
   '<div class="banner">⏳ <b>AI-generated — pending review.</b> Approve, or <b>Revise</b> with a note and the AI re-authors it, still grounded in the source. Nothing reaches a student until approved.</div>';
  s.lessons.forEach(function(l){n++;h+='<div class="org"><p>'+esc(l.stem)+'</p><div class="meta"><span class="nucleus"></span> backed by the source'+(l.citation&&l.citation.citation?' · <span class="cite">'+esc(l.citation.citation)+'</span>':'')+'</div>'+review('l'+n)+'</div>';});
  if(s.diagram){h+='<div class="diagram"><h4>◈ '+esc(s.diagram.title)+' <span class="badge" style="margin-left:6px">AI-generated</span></h4><div class="dcap">Drafted by the strong model from the cited passage — pending review.</div>'+svgSpec(s.diagram.spec)+'<div class="meta"><span class="nucleus"></span> diagram grounded'+(s.diagram.cite?' · <span class="num">'+esc(s.diagram.cite)+'</span>':'')+'</div>'+review('d')+'</div>';}
  [['Pre-test',s.pre],['Post-test',s.post]].forEach(function(pp){if(!pp[1].length)return;h+='<div class="railh" style="margin:16px 0 8px">'+pp[0]+' <span class="num">'+pp[1].length+'</span></div>';
    pp[1].forEach(function(q,qi){h+='<div class="org"><p><b>'+esc(q.stem)+'</b></p><div class="qopts">'+(q.options||[]).map(function(o,j){return '<div class="qopt'+(j===q.answer?' correct':'')+'"><span class="qlt">'+'ABCD'[j]+'</span> '+esc(o)+(j===q.answer?' ✓':'')+'</div>';}).join('')+'</div>'+(q.rationale?'<div class="srcline">key — '+esc(q.rationale)+'</div>':'')+review(pp[0]+qi)+'</div>';});});
  if(s.flashcards.length){h+='<div class="railh" style="margin:16px 0 8px">Study flashcards <span class="num">'+s.flashcards.length+'</span></div><div class="fcgrid">';
    s.flashcards.forEach(function(f,fi){h+='<div class="fc"><div class="fcq">'+esc(f.front)+'</div><div class="fca">'+esc(f.back)+'</div>'+review('f'+fi)+'</div>';});h+='</div>';}
  h+='<p class="note">A static snapshot of one generated chapter, for evaluation. In the app this is a live Next.js + Postgres surface; every item here was generated grounded in TC 3-22.9 and left pending review.</p></div>';
  $('#stage').innerHTML=h;$('#bk').onclick=function(){setView('course');};
}
$$('nav .tab[data-v]').forEach(function(t){t.onclick=function(){setView(t.dataset.v);};});
setView('studio');
</script>
