<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolCircle — Marksmanship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Design language borrowed from Zirkl — "cosmos + cellular": bioluminescent life
     in a dark void. Grounded knowledge glows and lives; a refusal is an organism
     that won't form. Numbers wear one warm mono, and only numbers do. It is also a
     real LMS: a course index, section tiles, activity completion, a graded quiz —
     Moodle's bones, a better skin. Two full worlds: deep-space night, daylight tide-pool. */

  :root{ /* LIGHT — daylight tide-pool (base) */
    --void:#e9eff8; --void-deep:#dde6f2;
    --surface:rgba(255,255,255,.74); --surface-2:rgba(255,255,255,.52); --panel:rgba(255,255,255,.6);
    --border:rgba(40,72,140,.14); --border-lit:rgba(11,160,145,.42);
    --text:#37415a; --dim:#6b7690; --bright:#0f1729; --faint:#9aa4bd;
    --glow:#0a9c8d; --glow-2:#4f6fe0; --glow-soft:rgba(11,160,145,.15);
    --assess:#c02d78; --assess-soft:rgba(192,45,120,.12);
    --glow-shadow:0 10px 30px rgba(40,72,140,.10); --lift:0 2px 10px rgba(40,72,140,.08);
    --readout:#b15e10; --readout-dim:rgba(177,94,16,.5);
    --danger:#cf3f3f; --danger-bg:rgba(207,63,63,.07); --ok:#0a9c8d;
    --mote1:rgba(11,160,145,.16); --mote2:rgba(79,111,224,.14); --mote3:rgba(210,140,40,.10);
    --grid:rgba(40,72,140,.07); --track:rgba(40,72,140,.10);
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --void:#05060b; --void-deep:#020208;
    --surface:rgba(16,20,36,.55); --surface-2:rgba(22,28,48,.5); --panel:rgba(10,13,24,.6);
    --border:rgba(120,150,220,.14); --border-lit:rgba(110,242,224,.35);
    --text:#cbd3e6; --dim:#7c86a3; --bright:#f4f7ff; --faint:#59627e;
    --glow:#6ef2e0; --glow-2:#8aa2ff; --glow-soft:rgba(110,242,224,.16);
    --assess:#ff8ad0; --assess-soft:rgba(255,138,208,.12);
    --glow-shadow:0 22px 55px rgba(0,0,0,.5); --lift:0 4px 18px rgba(0,0,0,.4);
    --readout:#ffb673; --readout-dim:rgba(255,182,115,.5);
    --danger:#ff8a8a; --danger-bg:rgba(255,138,138,.10); --ok:#6ef2e0;
    --mote1:rgba(110,242,224,.20); --mote2:rgba(138,162,255,.18); --mote3:rgba(255,182,115,.10);
    --grid:rgba(120,150,220,.05); --track:rgba(2,4,10,.6);
  }}
  :root[data-theme="dark"]{
    --void:#05060b; --void-deep:#020208;
    --surface:rgba(16,20,36,.55); --surface-2:rgba(22,28,48,.5); --panel:rgba(10,13,24,.6);
    --border:rgba(120,150,220,.14); --border-lit:rgba(110,242,224,.35);
    --text:#cbd3e6; --dim:#7c86a3; --bright:#f4f7ff; --faint:#59627e;
    --glow:#6ef2e0; --glow-2:#8aa2ff; --glow-soft:rgba(110,242,224,.16);
    --assess:#ff8ad0; --assess-soft:rgba(255,138,208,.12);
    --glow-shadow:0 22px 55px rgba(0,0,0,.5); --lift:0 4px 18px rgba(0,0,0,.4);
    --readout:#ffb673; --readout-dim:rgba(255,182,115,.5);
    --danger:#ff8a8a; --danger-bg:rgba(255,138,138,.10); --ok:#6ef2e0;
    --mote1:rgba(110,242,224,.20); --mote2:rgba(138,162,255,.18); --mote3:rgba(255,182,115,.10);
    --grid:rgba(120,150,220,.05); --track:rgba(2,4,10,.6);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:
      radial-gradient(120% 80% at 50% -10%, var(--mote1), transparent 55%),
      radial-gradient(90% 60% at 100% 110%, var(--mote2), transparent 55%),
      var(--void-deep);
    color:var(--text);font-family:var(--sans);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
  .void{position:fixed;inset:0;z-index:-2;background:var(--void-deep)}
  .mote{position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none;animation:drift 30s ease-in-out infinite alternate}
  .m1{width:380px;height:380px;top:-80px;left:-40px;background:radial-gradient(circle,var(--mote1),transparent 70%)}
  .m2{width:460px;height:460px;bottom:-140px;right:-60px;background:radial-gradient(circle,var(--mote2),transparent 70%);animation-duration:38s}
  .m3{width:300px;height:300px;top:45%;left:52%;background:radial-gradient(circle,var(--mote3),transparent 70%);animation-duration:46s}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(46px,-34px)}}
  @keyframes pulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  @keyframes bloom{from{opacity:0;transform:scale(.97) translateY(8px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .num,code,time,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--readout);letter-spacing:.01em}

  /* shell */
  .app{display:flex;flex-direction:column;height:100vh}
  .top{display:flex;align-items:center;gap:16px;height:56px;padding:0 20px;flex:0 0 auto;
    background:linear-gradient(180deg,color-mix(in srgb,var(--void) 82%,transparent),color-mix(in srgb,var(--void) 30%,transparent));
    backdrop-filter:blur(14px);border-bottom:1px solid var(--border);z-index:20}
  .brand{font-weight:900;font-size:18px;color:var(--bright);letter-spacing:-.02em;white-space:nowrap}
  .gp{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);white-space:nowrap}
  .gp .n{width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow);animation:pulse 2.6s ease-in-out infinite}
  .strip{display:flex;gap:8px;margin-left:6px;overflow:hidden}
  .stat{display:flex;flex-direction:column;line-height:1.15;padding:5px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
  .stat .v{font-family:var(--mono);font-size:14px;color:var(--readout);font-weight:600;font-variant-numeric:tabular-nums}
  .stat .k{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .stat.live .v{color:var(--glow)}
  nav{margin-left:auto;display:flex;gap:5px;align-items:center;flex:0 0 auto}
  nav .tab{background:transparent;border:none;color:var(--dim);font-family:var(--sans);font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.18s}
  nav .tab:hover{color:var(--text)}
  nav .tab.on{color:var(--void);background:var(--glow);box-shadow:0 0 22px var(--glow-soft)}
  .theme{background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:9px;width:32px;height:32px;font-size:14px;cursor:pointer;transition:.18s}
  .theme:hover{color:var(--text);border-color:var(--border-lit)}

  .grid{flex:1 1 auto;display:grid;grid-template-columns:250px 1fr 322px;min-height:0}
  .rail,.ctx{overflow-y:auto;padding:16px 14px}
  .rail{border-right:1px solid var(--border)}
  .ctx{border-left:1px solid var(--border);background:color-mix(in srgb,var(--panel) 55%,transparent)}
  .stage{overflow-y:auto;padding:24px 30px 60px}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--track);border-radius:8px}

  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  h1{font-size:25px;color:var(--bright);letter-spacing:-.02em;margin:0 0 4px;font-weight:800}
  .sub{color:var(--dim);font-size:14px;margin:0 0 20px;max-width:64ch}
  .view{animation:rise .4s ease both}

  /* course index drawer (the #1 "real LMS" signal) */
  .idxh{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:2px 4px 10px}
  .idxprog{height:5px;background:var(--track);border-radius:999px;overflow:hidden;margin:0 4px 14px}
  .idxprog span{display:block;height:100%;background:linear-gradient(90deg,var(--glow),var(--glow-2));box-shadow:0 0 10px var(--glow-soft);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .isec{margin-bottom:6px}
  .isec>.sh{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text)}
  .isec>.sh:hover{background:var(--surface-2)}
  .isec>.sh .ch{color:var(--faint);font-size:10px;transition:transform .2s}
  .isec.closed>.sh .ch{transform:rotate(-90deg)}
  .isec.closed .iacts{display:none}
  .iact{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 22px;border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--dim);transition:.14s}
  .iact:hover{background:var(--surface-2);color:var(--text)}
  .iact.on{background:var(--surface);color:var(--bright);box-shadow:inset 2px 0 0 var(--glow)}
  .iact .ico{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:9px;flex:0 0 auto;color:#fff}
  .ico.lesson{background:var(--glow)}.ico.quiz{background:var(--assess)}.ico.page{background:var(--glow-2)}
  .iact .cd{margin-left:auto;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);flex:0 0 auto;display:grid;place-items:center;font-size:9px}
  .iact .cd.done{border-color:var(--glow);background:var(--glow);color:var(--void)}

  /* course home */
  .chero{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 24px;margin-bottom:18px;backdrop-filter:blur(10px);box-shadow:var(--lift);position:relative;overflow:hidden}
  .chero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 100% 0,var(--glow-soft),transparent 60%);pointer-events:none}
  .chero .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .chero h1{margin:4px 0 8px}
  .chero .pm{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-top:12px}
  .cprog{flex:1;min-width:160px;height:8px;background:var(--track);border-radius:999px;overflow:hidden}
  .cprog span{display:block;height:100%;background:linear-gradient(90deg,var(--glow),var(--glow-2));box-shadow:0 0 12px var(--glow-soft);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .s0{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:16px}
  .s0 .t{font-weight:700;color:var(--bright);margin-bottom:4px}
  .s0 p{margin:0;font-size:13.5px;color:var(--dim)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:1320px){.tiles{grid-template-columns:1fr}}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;backdrop-filter:blur(10px);box-shadow:var(--lift);transition:.18s;position:relative;overflow:hidden}
  .tile:hover{border-color:var(--border-lit);transform:translateY(-2px)}
  .tile .tk{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .tile h3{font-size:16px;color:var(--bright);margin:3px 0 10px;font-weight:700}
  .arow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;transition:.14s;border:1px solid transparent}
  .arow:hover{background:var(--surface-2);border-color:var(--border)}
  .arow .ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;color:#fff;flex:0 0 auto}
  .arow .al{flex:1;min-width:0}.arow .al .an{font-size:13.5px;color:var(--text);font-weight:600}
  .arow .al .am{font-size:11px;color:var(--dim)}
  .arow .cd{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--faint);flex:0 0 auto;display:grid;place-items:center;font-size:11px;transition:.15s}
  .arow .cd.done{border-color:var(--glow);background:var(--glow);color:var(--void)}
  .tprog{margin-top:12px;height:5px;background:var(--track);border-radius:999px;overflow:hidden}
  .tprog span{display:block;height:100%;background:linear-gradient(90deg,var(--glow),var(--glow-2));width:0;transition:width .9s ease}

  /* generic */
  .btn{background:linear-gradient(180deg,var(--glow),color-mix(in srgb,var(--glow) 70%,#000));color:var(--void);border:none;border-radius:12px;padding:10px 17px;font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 0 24px var(--glow-soft);transition:.15s}
  .btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--glow);border:1px solid var(--border-lit);box-shadow:none}
  .btn.sm{padding:7px 13px;font-size:13px}
  .back{background:none;border:none;color:var(--glow);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--glow);background:var(--glow-soft);border:1px solid var(--border-lit);border-radius:999px;padding:4px 11px}
  .badge .n{width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);animation:pulse 2.4s infinite}

  /* organisms / cited claims */
  .org{padding:16px 18px;border-radius:15px;background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden;backdrop-filter:blur(10px);box-shadow:var(--lift);animation:bloom .5s cubic-bezier(.2,.8,.2,1) both;margin-bottom:12px}
  .org::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--glow),transparent);box-shadow:0 0 14px var(--glow);opacity:.9}
  .org p{margin:0 0 8px;color:var(--text);font-size:14.5px}
  .cite{font-family:var(--mono);font-size:11px;color:var(--glow);border:1px solid var(--border-lit);border-radius:6px;padding:1px 7px;cursor:pointer;transition:.15s;white-space:nowrap}
  .cite:hover{background:var(--glow-soft);box-shadow:0 0 12px var(--glow-soft)}
  .meta{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .nucleus{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow);animation:pulse 2.4s ease-in-out infinite}
  .sl{color:var(--dim);font-size:10.5px}
  .approve{margin-left:auto;font-size:12px;font-weight:700;color:var(--glow);background:var(--glow-soft);border:1px solid var(--border-lit);border-radius:9px;padding:5px 11px;cursor:pointer;transition:.15s}
  .approve.done{color:var(--void);background:var(--glow)}
  .src{margin-top:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;display:none;animation:bloom .3s both}
  .src.on{display:block}
  .src .k{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .src blockquote{margin:6px 0 4px;padding-left:12px;border-left:2px solid var(--glow);color:var(--bright);font-size:14px}
  .src cite{display:block;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--readout)}
  .refused{padding:17px 19px;border-radius:15px;background:var(--danger-bg);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);position:relative;overflow:hidden;animation:bloom .5s both;margin-bottom:12px}
  .refused::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--danger);box-shadow:0 0 14px var(--danger);opacity:.55}
  .refused .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--danger)}
  .refused p{margin:6px 0 0;color:var(--text);font-size:14px}.refused b{color:var(--danger)}
  .note{color:var(--dim);font-size:12.5px;margin-top:14px}
  .empty{color:var(--dim);text-align:center;padding:40px 18px;font-size:14px;border:1px dashed var(--border);border-radius:16px;background:var(--surface-2)}

  /* flow map */
  .flow{display:flex;gap:0;margin:14px 0;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:6px;backdrop-filter:blur(8px)}
  .fstep{flex:1 1 0;min-width:118px;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;position:relative;transition:.25s}
  .fstep .fi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:0 0 auto;background:var(--surface);border:1px solid var(--border);color:var(--dim)}
  .fstep .fl{line-height:1.2}.fstep .fl .a{font-size:12.5px;font-weight:700;color:var(--text)}.fstep .fl .b{font-size:10.5px;color:var(--dim)}
  .fstep.lit{background:var(--glow-soft)}
  .fstep.lit .fi{background:var(--glow);color:var(--void);border-color:transparent;box-shadow:0 0 16px var(--glow-soft)}
  .fstep.lit .fl .a{color:var(--bright)}
  .fstep:not(:last-child)::after{content:"\2192";position:absolute;right:-7px;color:var(--faint);font-size:13px;z-index:1}

  /* context panel bits */
  .ctxh{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:2px 0 12px}
  .ctxh .n{width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);animation:pulse 2s infinite}
  .log{display:grid;gap:8px}
  .logrow{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;padding:9px 11px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);animation:bloom .4s both}
  .logrow .ic{font-family:var(--mono);font-weight:600;flex:0 0 auto}
  .logrow.ok .ic{color:var(--glow)}.logrow.no .ic{color:var(--danger)}
  .logrow .tx{flex:1;color:var(--text);min-width:0}
  .logrow .sc{font-family:var(--mono);font-size:12px;color:var(--readout);flex:0 0 auto}
  .logrow.no{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
  .logrow.no .sc{color:var(--danger)}
  .logempty{color:var(--dim);font-size:12.5px;text-align:center;padding:26px 8px;border:1px dashed var(--border);border-radius:12px}
  .modelrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:6px;font-size:12px}
  .modelrow .md{width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 7px var(--glow);flex:0 0 auto}
  .modelrow .mn{flex:1;color:var(--text)}.modelrow .mm{font-family:var(--mono);font-size:11px;color:var(--readout-dim)}
  .ring{width:104px;height:104px;margin:2px auto 8px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--glow) calc(var(--p,0)*1%),var(--track) 0);transition:background 1s ease}
  .ring::after{content:"";width:80px;height:80px;border-radius:50%;background:var(--void);grid-area:1/1}
  .ring .l2{grid-area:1/1;z-index:1;text-align:center}.ring .l2 .n{font-family:var(--mono);font-size:22px;color:var(--glow);font-weight:600}.ring .l2 .u{font-size:10px;color:var(--dim)}
  .up{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;margin-bottom:6px}
  .up .st{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .up.now .st{background:var(--assess);box-shadow:0 0 8px var(--assess)}
  .up.soon .st{background:var(--readout);box-shadow:0 0 8px var(--readout-dim)}
  .up .ut{flex:1;color:var(--text)}.up .ud{font-family:var(--mono);font-size:11px;color:var(--dim)}

  /* quiz */
  .qwrap{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;backdrop-filter:blur(10px);box-shadow:var(--lift)}
  .qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .qtop .qn{font-family:var(--mono);font-size:12px;color:var(--dim)}

<body>
<div class="void"></div><div class="mote m1"></div><div class="mote m2"></div><div class="mote m3"></div>

<div class="app">
  <div class="top">
    <span class="brand">SchoolCircle</span>
    <span class="gp"><span class="n"></span> grounded by Anchor</span>
    <span class="conn" id="conn">● offline demo</span>
    <div class="strip">
      <div class="stat"><span class="v">99.0%</span><span class="k">Citations right</span></div>
      <div class="stat"><span class="v">15.8%</span><span class="k">Made-up &#8595;</span></div>
      <div class="stat live"><span class="v" id="sGround">0</span><span class="k">Backed</span></div>
      <div class="stat"><span class="v" id="sRef" style="color:var(--danger)">0</span><span class="k">Refused</span></div>
      <div class="stat"><span class="v" style="color:var(--glow)">&#9679; OK</span><span class="k">On-device</span></div>
    </div>
    <nav>
      <button class="tab on" data-v="course">Course</button>
      <button class="tab" data-v="ask">Ask</button>
      <button class="tab" data-v="practice">Quiz</button>
      <button class="tab" data-v="insight">Insight</button>
      <button class="theme" id="tg" title="Toggle light / dark">&#9680;</button>
    </nav>
  </div>

  <div class="grid">
    <aside class="rail" id="rail"></aside>
    <main class="stage" id="stage"></main>
    <aside class="ctx" id="ctx"></aside>
  </div>
</div>

<script>
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};

/* ---------- live Anchor hookup (same-origin via serve.js + SSH tunnel) ---------- */
var ANCHOR_BASE=(location.protocol==='http:'||location.protocol==='https:')?'':null; /* null on file:// -> mock only */
var LIVE=false;
function setConn(on){LIVE=on;var p=$('#conn');if(p){p.textContent=on?'● live · Orin':'● offline demo';p.classList.toggle('on',on);}}
function callAnchor(q){if(ANCHOR_BASE===null)return Promise.reject('file');
  return fetch(ANCHOR_BASE+'/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})}).then(function(r){if(!r.ok)throw r.status;return r.json();});}
function probeLive(){if(ANCHOR_BASE===null){setConn(false);return;}
  fetch(ANCHOR_BASE+'/api/health').then(function(r){return r.json();}).then(function(d){setConn(!!(d&&d.ok));}).catch(function(){setConn(false);});}
var GENQ={s5:['What is precision and accuracy of the shot?','What is the shot process?'],
  s6:['What is a stable firing position?','What is a spot weld?'],
  s7:['What is the aiming process?','What is desired point of impact?'],
  s8:['What is trigger squeeze?','What is the integrated act of shooting?']};

/* ---------- grounded visuals: the AI emits a spec, the front-end renders SVG ---------- */
function lessonVisuals(sec){
  if(sec==='s5')return diagLinkage();
  if(sec==='s6')return diagNPA();
  if(sec==='s7')return diagSightPicture()+intAlignSights()+diagShotProcess();
  if(sec==='s8')return diagTriggerTimeline()+intTrigger();
  return '';
}
function dcite(q,c){return '<div class="meta"><span class="nucleus"></span> diagram grounded <span class="cite" onclick="var e=this.parentNode.parentNode.querySelector(\'.src\');e&&e.classList.toggle(\'on\')">[1]</span></div>'+
  '<div class="src"><div class="k">source passage</div><blockquote>'+q+'</blockquote><cite>'+c+'</cite></div>';}
function diagLinkage(){function node(x,y,t){return '<rect x="'+(x-46)+'" y="'+(y-15)+'" width="92" height="30" rx="8" fill="var(--surface-2)" stroke="var(--border-lit)" stroke-width="1.5"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="600" font-family="Inter,sans-serif">'+t+'</text>';}
  return '<div class="diagram"><h4>◈ The functional elements</h4><div class="dcap">Shooter, weapon, environment, and target link through every shot — the manual’s framing.</div>'+
  '<svg viewBox="0 0 360 210" role="img" aria-label="Functional elements linkage">'+
  '<line x1="70" y1="45" x2="180" y2="105" stroke="var(--glow)" stroke-width="1.3" opacity=".6"/><line x1="290" y1="45" x2="180" y2="105" stroke="var(--glow)" stroke-width="1.3" opacity=".6"/>'+
  '<line x1="70" y1="165" x2="180" y2="105" stroke="var(--glow)" stroke-width="1.3" opacity=".6"/><line x1="290" y1="165" x2="180" y2="105" stroke="var(--glow)" stroke-width="1.3" opacity=".6"/>'+
  '<circle cx="180" cy="105" r="34" fill="var(--glow-soft)" stroke="var(--glow)" stroke-width="2"/><text x="180" y="110" text-anchor="middle" fill="var(--glow)" font-size="13" font-weight="700" font-family="Inter,sans-serif">SHOT</text>'+
  node(70,45,'Shooter')+node(290,45,'Weapon')+node(70,165,'Environment')+node(290,165,'Target')+
  '</svg>'+dcite('The functional elements of the shot process are the linkage between the Soldier, the weapon system, the environment, and the target that directly impact the shot process.','TC 3-22.9 (May 2016, Ch 3), Ch 5 “Functional Elements of the Shot Process”, para 1, p.5-3')+'</div>';}
function diagNPA(){return '<div class="diagram"><h4>◈ Natural point of aim</h4><div class="dcap">Relax the muscles and the barrel settles to its natural point of aim — move the body to bring it onto the target.</div>'+
  '<svg viewBox="0 0 360 170" role="img" aria-label="Natural point of aim">'+
  '<circle cx="300" cy="60" r="22" fill="var(--glow-soft)" stroke="var(--glow-2)" stroke-width="1.5"/><circle cx="300" cy="60" r="3" fill="var(--danger)"/><text class="dlabel" x="276" y="30">target</text>'+
  '<circle cx="60" cy="120" r="9" fill="var(--text)" opacity=".7"/><text class="dlabel" x="40" y="150">shooter</text>'+
  '<line x1="66" y1="116" x2="298" y2="62" stroke="var(--glow)" stroke-width="2.5"/>'+
  '<line x1="66" y1="116" x2="300" y2="112" stroke="var(--readout)" stroke-width="1.6" stroke-dasharray="5 4"/>'+
  '<text class="dlabel" x="150" y="80" fill="var(--glow)">natural point of aim</text><text class="dlabel" x="150" y="132" fill="var(--readout)">muscled = drifts back</text>'+
  '</svg>'+dcite('The natural point of aim is the point where the barrel naturally orients when the shooter’s muscles are relaxed and support is achieved.','TC 3-22.9 (May 2016, Ch 3), Ch 6 “Natural Point of Aim”, para 2, p.6-4')+'</div>';}
function diagTriggerTimeline(){function seg(x,w,t,hot){return '<rect x="'+x+'" y="44" width="'+w+'" height="26" rx="6" fill="'+(hot?'var(--glow-soft)':'var(--surface-2)')+'" stroke="'+(hot?'var(--glow)':'var(--border)')+'" stroke-width="1.3"/><text x="'+(x+w/2)+'" y="61" text-anchor="middle" fill="var(--text)" font-size="10" font-family="Inter,sans-serif">'+t+'</text>';}
  return '<div class="diagram"><h4>◈ Trigger control &amp; follow-through</h4><div class="dcap">Hold the sights through the break — trigger control lasts until the bullet leaves the muzzle, then follow-through continues.</div>'+
  '<svg viewBox="0 0 360 108" role="img" aria-label="Trigger timeline">'+
  seg(6,78,'take slack',false)+seg(88,84,'press straight',false)+seg(176,54,'break',true)+seg(234,120,'HOLD',true)+
  '<line x1="234" y1="36" x2="234" y2="76" stroke="var(--readout)" stroke-width="1.5"/><text class="dlabel" x="198" y="28" fill="var(--readout)">bullet leaves muzzle</text>'+
  '</svg>'+dcite('Trigger control is the act of firing the weapon while maintaining proper aim and adequate stabilization until the bullet leaves the muzzle.','TC 3-22.9 (May 2016, Ch 3), Ch 8 “Trigger Control”, para 2, p.8-2')+'</div>';}
function intTrigger(){return '<div class="interactive"><div class="it">◉ Try it — press the trigger</div>'+
  '<svg viewBox="0 0 340 92" role="img" aria-label="Trigger press">'+
  '<circle cx="170" cy="46" r="34" fill="none" stroke="var(--dim)" stroke-width="2" opacity=".5"/><circle cx="170" cy="46" r="16" fill="var(--glow-soft)" stroke="var(--glow-2)"/><circle id="tdot" cx="170" cy="46" r="5" fill="var(--glow)"/></svg>'+
  '<input class="sldr" type="range" min="0" max="100" value="18" oninput="updateTrigger(this.value)" aria-label="press rate">'+
  '<div class="istatus" id="tstat">Slide slowly for a smooth press · quickly to jerk it.</div>'+

function generate(bad){
  var out=$('#lessonOut');if(!out)return;
  logReset();flowSeq();
  if(bad){
    /* one refusal only — never duplicate it */
    var existing=$('#lessonOut .refused');
    if(existing){existing.style.animation='none';existing.offsetHeight;existing.style.animation='bloom .5s both';return;}
    out.insertAdjacentHTML('beforeend','<div class="org" id="shim" style="border-style:dashed"><p style="color:var(--glow);margin:0">◍ checking the premise against the manual…</p></div>');
    var showRef=function(text,flag){var s=$('#shim');if(s)s.remove();out.insertAdjacentHTML('beforeend',refusedCard(text,flag));state.ref++;bump();logRow(false,'“four phases of the shot process” — not in the source',null,200);};
    callAnchor('What are the four phases of the shot process?').then(function(d){
      var f=(d.premise_flags&&d.premise_flags[0]&&d.premise_flags[0].support!=null)?(+d.premise_flags[0].support).toFixed(2):'0.40';
      showRef(d.text||'The manual describes three phases — pre-shot, shot, post-shot — not four.',f);
    }).catch(function(){setTimeout(function(){showRef('The manual describes three — pre-shot, shot, post-shot. The fact-checker found nothing entailing a fourth.','0.40');},reduce?0:700);});
    return;
  }
  /* generate more — deduped by question AND by citation, so it can never repeat */
  var shown=state.shown[curLesson]||(state.shown[curLesson]={});
  /* seed shown-citations from the claims already on the page */
  (CLAIMS[curLesson]||[]).forEach(function(cl){shown['c:'+cl.c]=1;});
  if(!LIVE){
    if(!$('#genNote'))out.insertAdjacentHTML('beforeend','<div class="note" id="genNote" style="margin-top:12px">Offline demo — the pre-verified points above are the full grounded set. Connect the Orin (live) and this button pulls a <b>fresh, cited</b> point from the manual on demand.</div>');
    return;
  }
  var qs=(GENQ[curLesson]||[]).slice();
  (function tryNext(){
    var q=null;while(qs.length){var cand=qs.shift();if(!shown[cand]){q=cand;shown[cand]=1;break;}}
    if(!q){if(!$('#genNote'))out.insertAdjacentHTML('beforeend','<div class="note" id="genNote" style="margin-top:12px">No new source-backed points for this lesson — every grounded claim is already shown.</div>');return;}
    out.insertAdjacentHTML('beforeend','<div class="org" id="shim" style="border-style:dashed"><p style="color:var(--glow);margin:0">◍ '+esc(q)+' …</p></div>');
    callAnchor(q).then(function(d){var s=$('#shim');if(s)s.remove();
      if(d.abstained||!(d.citations&&d.citations.length)){logRow(false,'“'+q+'” — not in the source',null,120);tryNext();return;}
      var cstr=d.citations[0].citation;if(shown['c:'+cstr]){tryNext();return;}shown['c:'+cstr]=1;
      out.insertAdjacentHTML('beforeend',liveClaimCard(d));wireClaims();state.ground++;bump();logRow(true,'“'+q+'” — backed by source','live');
    }).catch(function(){var s=$('#shim');if(s)s.remove();if(!$('#genNote'))out.insertAdjacentHTML('beforeend','<div class="note" id="genNote" style="margin-top:12px">Couldn’t reach the tutor just now — try again, or check the Orin connection (pill up top).</div>');});
  })();
}

  '<div class="modelrow"><span class="md"></span><span class="mn">Follow-through</span><span class="mm">Ch 8</span></div>'+
  '<div class="modelrow"><span class="md"></span><span class="mn">Natural point of aim</span><span class="mm">Ch 6</span></div>'+
  '<div class="modelrow"><span class="md"></span><span class="mn">Functional elements</span><span class="mm">Ch 5</span></div>'+
  '<p class="note">Every branch’s feedback is grounded in the cited fundamental — the scenario <b style="color:var(--text)">applies</b> doctrine, it doesn’t invent it.</p>';}

/* ---------- center: ASK THE TUTOR (Operational Support) ---------- */
var ASKCANNED=[
  {k:['sight alignment','sight picture'],a:'Sight alignment is the relationship between the aiming device and the firer’s eye. Sight picture is the placement of the aligned sights on the target.',c:'TC 3-22.9, Ch 7 “Desired Point of Impact”, para 1, p.7-5'},
  {k:['trigger control','trigger'],a:'Trigger control is firing the weapon while maintaining proper aim and adequate stabilization until the bullet leaves the muzzle.',c:'TC 3-22.9, Ch 8 “Trigger Control”, para 2, p.8-2'},
  {k:['natural point of aim','npa'],a:'The natural point of aim is where the barrel naturally orients when the shooter’s muscles are relaxed and support is achieved.',c:'TC 3-22.9, Ch 6 “Natural Point of Aim”, para 2, p.6-4'},
  {k:['functional element','shot process element'],a:'The functional elements of the shot process are the linkage between the shooter, the weapon, the environment, and the target that drive a consistent shot.',c:'TC 3-22.9, Ch 5 “Functional Elements of the Shot Process”, para 1, p.5-3'},
  {k:['follow-through','follow through'],a:'Follow-through is the continued application of the shot-process elements after the shot has fired.',c:'TC 3-22.9, Ch 8 “Follow-Through”, para 1, p.8-7'},
  {k:['aiming process','pre-shot','pre shot'],a:'Aiming is a continuous process conducted through pre-shot, shot, and post-shot — three phases.',c:'TC 3-22.9, Ch 6 “Aiming”, para 3'},
  {k:['point of impact','center of mass','center of visible mass'],a:'The desired point of impact is where the shooter wants the round to strike — typically the center of visible mass.',c:'TC 3-22.9, Ch 7 “Desired Point of Impact”, para 5, p.7-5'}
];
var ASKREFUSE=[{k:['four phases','6 phases','six phases','4 phases'],flag:'0.40',t:'The sources do not support that the shot process has four phases — the manual describes three: pre-shot, shot, post-shot.'}];
function askLookup(q){var s=(' '+q.toLowerCase()+' ');
  for(var i=0;i<ASKREFUSE.length;i++)for(var j=0;j<ASKREFUSE[i].k.length;j++)if(s.indexOf(ASKREFUSE[i].k[j])>=0)return {refuse:true,t:ASKREFUSE[i].t,flag:ASKREFUSE[i].flag};
  for(var i=0;i<ASKCANNED.length;i++)for(var j=0;j<ASKCANNED[i].k.length;j++)if(s.indexOf(ASKCANNED[i].k[j])>=0)return {a:ASKCANNED[i].a,c:ASKCANNED[i].c};
  return {refuse:true,t:'I can’t answer that from the doctrine on this device — nothing in the indexed corpus supports it.',flag:null};}
function answerInline(res){return '<div class="org"><p>'+esc(res.a)+' <span class="cite" onclick="var e=this.closest(\'.org\').querySelector(\'.src\');e&&e.classList.toggle(\'on\')">[1]</span></p>'+
  '<div class="meta"><span class="nucleus"></span> '+(LIVE?'<span class="badge" style="padding:2px 9px">● live · Orin</span> ':'')+'backed by the source</div>'+
  '<div class="src"><div class="k">source passage</div><cite>'+esc(res.c)+'</cite></div></div>';}
function refusedInline(res){return '<div class="refused"><div class="k">refused — not in the source</div><p>'+esc(res.t)+(res.flag?' <span class="num">'+res.flag+'</span> premise support.':'')+'</p></div>';}
function renderAsk(){
  var chips=['What is sight alignment and sight picture?','What is trigger control?','What is a natural point of aim?','What are the four phases of the shot process?'];
  var h='<div class="view"><div class="eyebrow">Operational Support · just-in-time grounded reference</div>'+
    '<h1>Ask the doctrine</h1><p class="sub">Ask any marksmanship question — get an answer cited to TC 3-22.9, or an honest “not in the source.” Runs on the device, offline.</p>'+
    '<div class="askbar"><input id="askq" class="askinput" placeholder="e.g. What is trigger control?" autocomplete="off"><button class="btn" id="askgo">Ask</button></div>'+
    '<div class="chips">'+chips.map(function(c){return '<button class="chip">'+esc(c)+'</button>';}).join('')+'</div>'+
    '<div id="askout"></div></div>';
  $('#stage').innerHTML=h;
  $$('#stage .chip').forEach(function(b){b.onclick=function(){$('#askq').value=b.textContent;doAsk();};});
  $('#askgo').onclick=doAsk;$('#askq').onkeydown=function(e){if(e.key==='Enter')doAsk();};
  setTimeout(function(){var i=$('#askq');if(i)i.focus();},60);
}
function doAsk(){var i=$('#askq');if(!i)return;var q=i.value.trim();if(!q)return;i.value='';
  var out=$('#askout');
  out.insertAdjacentHTML('afterbegin','<div class="org" id="askshim" style="border-style:dashed"><p style="color:var(--glow);margin:0">◍ searching the doctrine on this device…</p></div>');
  var render=function(res){var s=$('#askshim');if(s)s.remove();
    out.insertAdjacentHTML('afterbegin','<div class="askitem"><div class="askq">'+esc(q)+'</div>'+(res.refuse?refusedInline(res):answerInline(res))+'</div>');};
  if(LIVE){callAnchor(q).then(function(d){
    if(d.abstained&&d.premise_flags&&d.premise_flags[0])render({refuse:true,t:d.text,flag:(+d.premise_flags[0].support).toFixed(2)});
    else if(d.abstained)render({refuse:true,t:d.text,flag:null});
    else render({a:d.text,c:(d.citations&&d.citations[0])?d.citations[0].citation:''});
  }).catch(function(){render(askLookup(q));});}
  else setTimeout(function(){render(askLookup(q));},reduce?0:500);
}
function ctxAsk(){$('#ctx').innerHTML='<div class="ctxh"><span class="n"></span> runs on this device · nothing leaves</div>'+
  '<div class="modelrow"><span class="md"></span><span class="mn">The librarian · search</span><span class="mm">bge</span></div>'+
  '<div class="modelrow"><span class="md"></span><span class="mn">The writer</span><span class="mm">gemma</span></div>'+
  '<div class="modelrow"><span class="md"></span><span class="mn">The fact-checker</span><span class="mm">HHEM</span></div>'+
  '<p class="note">It answers only what TC 3-22.9 supports, cites it, and refuses the rest — the same grounded engine behind every lesson. Nothing leaves the device.</p>';}

/* ---------- adaptivity (Personalized Learning) ---------- */
var QMAP=['s7','s8','s6'];
var QCONCEPT=['Phases of the shot process','Trigger control','Natural point of aim'];
function masteryOf(sec){if(state.mastery[sec]!=null)return state.mastery[sec];var d=false;COURSE.sections.forEach(function(s){if(s.id===sec)s.acts.forEach(function(a){if(a.kind==='lesson'&&a.done)d=true;});});return d?52:22;}
function weakestSection(){var secs=COURSE.sections.filter(function(s){return !s.intro;}),w=secs[0],wm=101;secs.forEach(function(s){var m=masteryOf(s.id);if(m<wm){wm=m;w=s;}});return w;}
function applyQuizToMastery(){state.resurface=[];state.assessed=true;
  QUIZ.forEach(function(q,i){var ok=quiz.ans[i]===q.ans,conf=quiz.conf[i],sec=QMAP[i];var cur=masteryOf(sec);
    if(!ok){state.mastery[sec]=Math.max(5,cur-22);state.resurface.push({sec:sec,concept:QCONCEPT[i],reason:(conf>=2?'certain but wrong':'missed'),when:(conf>=2?'now':'today')});}
    else{state.mastery[sec]=Math.min(100,cur+(conf>=2?18:8));if(conf<2)state.resurface.push({sec:sec,concept:QCONCEPT[i],reason:'right but unsure',when:'+3d'});}});
}

/* ---------- router ---------- */
function bump(){var g=$('#sGround'),r=$('#sRef');if(g)g.textContent=state.ground;if(r)r.textContent=state.ref;}
function setTabs(v){$$('nav .tab').forEach(function(t){t.classList.toggle('on',t.dataset.v===v);});}
function go(v){state.view=v;setTabs((v==='lesson'||v==='scenario')?'course':v);
  if(v==='course')renderCourse();
  else if(v==='lesson')renderLesson();
  else if(v==='scenario')renderScenario();
  else if(v==='ask')renderAsk();
  else if(v==='practice'){renderQuiz();}
  else if(v==='insight')renderInsight();
  renderRail();renderCtx();window.scrollTo&&$('#stage')&&($('#stage').scrollTop=0);}
$$('nav .tab').forEach(function(t){t.onclick=function(){go(t.dataset.v);};});

/* init */
bump();probeLive();go('course');
</script>
