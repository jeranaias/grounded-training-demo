<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolCircle — Grounded Training Platform</title>
<meta name="description" content="The grounded AI training platform in action — instructor and student dashboards showing how courses are built, grounded, reviewed, delivered, and measured.">
<style>
:root{
  --p-bg:#f5f5f7;--p-surface:#ffffff;--p-surface-2:#ececef;
  --p-border:rgba(0,0,0,.08);--p-border-soft:rgba(0,0,0,.06);
  --p-text:#1d1d1f;--p-dim:#6e6e73;--p-faint:#86868b;
  --p-rail:rgba(255,255,255,.72);--p-ink:#1d1d1f;
  --p-accent:#b3122e;--p-accent-bright:#e0334f;--p-accent-tint:rgba(179,18,46,.10);
  --p-good:#1e7a3c;--p-warning:#b0731a;--p-critical:#c2410c;--p-critical-tint:#fff5f0;--p-seq:#8a95a3;
  --p-shadow:0 2px 12px rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.04);
  --p-shadow-lift:0 10px 28px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04);
  --p-radius:18px;
  --sans:-apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono","Cascadia Code",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--p-bg);color:var(--p-text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex}
a{color:var(--p-accent);text-decoration:none}
code{font-family:var(--mono);font-size:.76em;font-weight:500;color:var(--p-dim);background:rgba(0,0,0,.05);border-radius:5px;padding:.1em .4em;vertical-align:middle}
[hidden]{display:none!important}
.card,.s-next-card,.s-box,.s-req,.s-hero-tile,.p-panel,.p-tile,.p-coacard{background:var(--p-surface);border:none;box-shadow:var(--p-shadow);border-radius:var(--p-radius)}

/* ---------- shell ---------- */
.root{flex:1;display:flex;min-height:0;--rail-w:15rem;--agenda-w:20rem;--max:82rem}
.rail{width:var(--rail-w);flex:none;background:var(--p-rail);backdrop-filter:blur(24px) saturate(180%);border-right:.5px solid var(--p-border);display:flex;flex-direction:column;padding:1.3rem .75rem 1rem;gap:.1rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-user{display:flex;align-items:center;gap:.65rem;padding:.3rem .6rem 1rem}
.avatar{width:2.2rem;height:2.2rem;flex:none;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p-accent),var(--p-accent-bright));color:#fff;font-size:.75em;font-weight:700}
.rail-who{display:flex;flex-direction:column;min-width:0}
.rail-name{font-size:.95em;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-role{font-size:.76em;color:var(--p-faint)}
.seg{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.05);border-radius:980px;margin:0 .3rem .5rem}
.seg button{flex:1;background:none;border:none;border-radius:980px;color:var(--p-dim);font:inherit;font-size:.82em;font-weight:600;padding:.4rem .3rem;cursor:pointer}
.seg button.on{background:var(--p-accent);color:#fff}
.navlabel{font-size:.72em;font-weight:600;color:var(--p-faint);padding:1rem .8rem .3rem;text-transform:uppercase;letter-spacing:.06em}
.navbtn{display:flex;align-items:center;gap:.75rem;background:none;border:none;border-radius:10px;color:var(--p-text);font:inherit;font-size:.96em;cursor:pointer;padding:.55rem .8rem;text-align:left;width:100%}
.navbtn:hover{background:rgba(0,0,0,.05)}
.navbtn.on{background:var(--p-accent-tint);color:var(--p-accent);font-weight:600}
.navbtn .ico{width:1.25rem;height:1.25rem;flex:none;color:var(--p-faint)}
.navbtn.on .ico{color:var(--p-accent)}
.navbtn .ico svg{width:100%;height:100%}
.navbtn .badge{margin-left:auto;background:var(--p-accent);color:#fff;font-size:.7em;font-weight:700;border-radius:980px;padding:.05em .5em}
.rail-sp{flex:1}
.rail-foot{color:var(--p-dim);font-size:.86em}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.crumbs{display:flex;align-items:center;gap:.5rem;padding:.9rem 2.4rem 0;font-size:.82em;color:var(--p-faint)}
.crumbs .sp{flex:1}
.main{flex:1;padding:.7rem 2.4rem 3.5rem}
.container{max-width:var(--max);margin:0 auto}
.pagehead{margin-bottom:1.4rem}
.pagehead h1{margin:0 0 .3rem;font-size:2.1em;letter-spacing:-.026em;font-weight:700;line-height:1.1}
.pagehead p{margin:0;color:var(--p-dim);font-size:1.02em;max-width:64ch}
.label{margin:1.4rem 0 .7rem;font-size:.85em;color:var(--p-faint);font-weight:600}
.label:first-child{margin-top:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) var(--agenda-w);gap:1.6rem;align-items:start}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem;margin-bottom:1.4rem}
.tile{padding:1.1rem 1.3rem}
.tilelab{font-size:.82em;font-weight:600;color:var(--p-faint)}
.tileval{font-size:2.2em;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:.2rem}
.tilenote{font-size:.82em;color:var(--p-dim);margin-top:.15rem}
.tileval.good{color:var(--p-good)}.tileval.warn{color:var(--p-warning)}.tileval.crit{color:var(--p-critical)}

/* ---------- cards ---------- */
.cards{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(20rem,100%),1fr));margin-bottom:1.4rem}
.card{padding:1.3rem 1.4rem;display:flex;flex-direction:column;gap:.9rem;text-align:left}
.card.click{cursor:pointer;transition:box-shadow .15s,transform .15s}
.card.click:hover{box-shadow:var(--p-shadow-lift);transform:translateY(-1px)}
.card-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
.card-title{font-weight:600;font-size:1.2em;letter-spacing:-.015em;line-height:1.2}
.card-sub{font-size:.85em;color:var(--p-faint);margin-top:.25rem}
.card-avg{text-align:right;flex:none;line-height:1}
.card-avg span{display:block;font-size:2.2em;font-weight:700;letter-spacing:-.03em}
.card-avg small{font-size:.7em;color:var(--p-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card-foot{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.85em;color:var(--p-dim)}
.prog{display:flex;flex-direction:column;gap:.35rem;font-size:.8em;color:var(--p-faint)}
.track{height:.4rem;background:rgba(0,0,0,.06);border-radius:980px;overflow:hidden}
.fill{height:100%;background:var(--p-accent);border-radius:980px}

/* next cards */
.next{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(15rem,100%),1fr));margin-bottom:1.4rem}
.next-card{background:var(--p-surface);box-shadow:var(--p-shadow);border-radius:var(--p-radius);padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:.3rem}
.next-card.late{background:var(--p-critical-tint)}
.next-kind{font-size:.8em;color:var(--p-accent);font-weight:600}
.next-card.late .next-kind{color:var(--p-critical)}
.next-title{font-weight:600;font-size:1.05em;letter-spacing:-.01em}
.next-meta{font-size:.85em;color:var(--p-dim)}

/* panels */
.panel{padding:1.3rem 1.45rem;margin-bottom:1.2rem}
.panel h3{margin:0 0 1rem;font-size:.85em;color:var(--p-faint);font-weight:600}
.btn{background:var(--p-accent);color:#fff;border:none;border-radius:980px;padding:0 1.2rem;height:2.5rem;font:inherit;font-size:.92em;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:rgba(0,0,0,.05);color:var(--p-text)}
.btn.sm{height:2rem;font-size:.85em;padding:0 .9rem}
.btnrow{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.4rem}
.drop{border:1.5px dashed rgba(0,0,0,.16);border-radius:14px;padding:1rem 1.1rem;display:flex;align-items:center;gap:.7rem;color:var(--p-dim);font-size:.9em;background:var(--p-surface-2);margin-bottom:.9rem}
textarea{width:100%;background:var(--p-surface-2);border:none;box-shadow:0 0 0 .5px rgba(0,0,0,.12);border-radius:12px;padding:.8rem 1rem;color:var(--p-text);font-family:var(--mono);font-size:.8rem;line-height:1.6;outline:none;resize:vertical;min-height:8rem}
textarea:focus{box-shadow:0 0 0 1.5px var(--p-accent)}

/* pipeline */
.steps{list-style:none;margin:.4rem 0 0;padding:0;display:flex;flex-direction:column;gap:.55rem}
.step{display:flex;align-items:center;gap:.7rem;font-size:.9em;color:var(--p-faint);transition:color .2s}
.step.run{color:var(--p-text)}.step.done{color:var(--p-dim)}
.stepdot{width:1.2em;height:1.2em;border-radius:50%;flex:none;border:2px solid var(--p-border);display:grid;place-items:center;font-size:.7em;color:#fff;box-sizing:border-box}
.step.run .stepdot{border-color:var(--p-accent);border-right-color:transparent;animation:spin .7s linear infinite}
.step.done .stepdot{border-color:var(--p-good);background:var(--p-good)}
@keyframes spin{to{transform:rotate(360deg)}}

/* generated / review items */
.item{background:var(--p-surface);box-shadow:var(--p-shadow);border-radius:14px;padding:1rem 1.2rem;margin-bottom:.8rem;display:flex;flex-direction:column;gap:.5rem;animation:bloom .35s both}
@keyframes bloom{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.item-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.item-kind{font-size:.72em;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--p-faint)}
.item h4{margin:0;font-size:1.02em;font-weight:600}
.item .txt{font-size:.92em;color:var(--p-text);line-height:1.55}
.cite{display:inline-block;font-family:var(--mono);font-size:.74em;color:var(--p-dim);background:rgba(0,0,0,.05);border-radius:6px;padding:.12em .5em}
.statepill{font-size:.7em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.15em .6em;border-radius:980px;margin-left:auto}
.statepill.pending{background:rgba(176,115,26,.14);color:var(--p-warning)}
.statepill.approved{background:rgba(30,122,60,.12);color:var(--p-good)}
.statepill.rejected{background:var(--p-critical-tint);color:var(--p-critical)}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.72em;font-weight:700;border-radius:980px;padding:.2rem .6rem}
.badge.ok{background:rgba(30,122,60,.12);color:var(--p-good)}
.badge.no{background:var(--p-critical-tint);color:var(--p-critical);box-shadow:inset 0 0 0 1px rgba(194,65,12,.25)}

/* mastery chart */
.chart{display:flex;flex-direction:column;gap:.6rem}
.crow{display:grid;grid-template-columns:11rem 1fr 4rem;align-items:center;gap:.8rem}
.crow .cl{font-size:.86em;color:var(--p-dim);text-align:right}
.crow .cv{font-size:.86em;font-variant-numeric:tabular-nums;font-weight:600}

/* table */
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.88em}
table.t th{text-align:left;font-size:.8em;color:var(--p-faint);font-weight:600;padding:.5rem .6rem;border-bottom:.5px solid var(--p-border);white-space:nowrap}
table.t td{padding:.6rem .6rem;border-bottom:.5px solid var(--p-border);color:var(--p-dim)}
table.t tr:last-child td{border-bottom:none}
table.t td:first-child{color:var(--p-text);font-weight:500}
.num{font-variant-numeric:tabular-nums;text-align:right}

/* AAR findings */
.find{border-left:3px solid var(--p-border);padding:.2rem 0 .2rem .9rem;margin-bottom:.9rem}
.find.crit{border-left-color:var(--p-critical)}.find.warn{border-left-color:var(--p-warning)}.find.good{border-left-color:var(--p-good)}
.find-h{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95em;flex-wrap:wrap}
.find-b{font-size:.86em;color:var(--p-dim);margin:.15rem 0 0}
.horizon{font-size:.68em;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:.1em .5em;border-radius:5px;background:rgba(0,0,0,.05);color:var(--p-dim)}

/* chat (ask + mastery) */
.chat{display:flex;flex-direction:column;gap:.7rem;margin:.5rem 0 1rem}
.bubble{max-width:82%;padding:.8rem 1.1rem;border-radius:16px;font-size:.92em;line-height:1.5}
.bubble.me{align-self:flex-end;background:var(--p-accent);color:#fff;border-bottom-right-radius:5px;font-weight:500}
.bubble.ai{align-self:flex-start;background:var(--p-surface);box-shadow:var(--p-shadow);border-bottom-left-radius:5px}
.bubble.ai.refuse{box-shadow:inset 0 0 0 1px rgba(194,65,12,.3)}
.vbadge{font-size:.7em;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.1em .5em;border-radius:980px;display:inline-block;margin-bottom:.35rem}
.vbadge.ok{background:rgba(30,122,60,.12);color:var(--p-good)}
.vbadge.mid{background:rgba(176,115,26,.14);color:var(--p-warning)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.chip{background:var(--p-surface);box-shadow:0 0 0 .5px rgba(0,0,0,.12);border-radius:980px;padding:.4rem .9rem;font-size:.85em;color:var(--p-dim);cursor:pointer}
.chip:hover{box-shadow:0 0 0 1.5px var(--p-accent);color:var(--p-text)}
.chip.refuse{color:var(--p-critical)}

/* study plan COAs */
.coa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(13rem,100%),1fr));gap:.8rem;margin-bottom:1rem}
.coacard{padding:1rem 1.1rem;cursor:pointer;text-align:left;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
.coacard.on{box-shadow:0 0 0 1.5px var(--p-accent);background:var(--p-accent-tint)}
.coacard h4{margin:0 0 .2rem;font-size:1em}
.coacard p{margin:0;font-size:.82em;color:var(--p-dim)}
.plan{list-style:none;margin:0;padding:0}
.planrow{display:grid;grid-template-columns:6rem 1fr auto;gap:.8rem;align-items:baseline;padding:.5rem 0;border-bottom:.5px solid var(--p-border);font-size:.88em}
.planrow:last-child{border-bottom:none}
.pldate{color:var(--p-faint);font-size:.9em}
.plkind{font-size:.72em;font-family:var(--mono);text-transform:uppercase;color:var(--p-faint)}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:1.2rem;padding-top:4.2rem}
.box{padding:1.1rem 1.25rem}
.box h4{margin:0 0 .6rem;font-size:.85em;color:var(--p-faint);font-weight:600}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:.7rem;align-items:baseline;padding:.55rem 0;border-bottom:.5px solid var(--p-border);font-size:.9em}
.list li:last-child{border-bottom:none}
.list .k{font-size:.8em;color:var(--p-faint)}
.tick{flex:none;width:1.05em;height:1.05em;margin-top:.15em;border:1.5px solid #c7c7cc;border-radius:50%}
.req{padding:.3rem 1.3rem}
.reqrow{display:flex;align-items:center;gap:.7rem;font-size:.92em;padding:.65rem 0;border-bottom:.5px solid var(--p-border)}
.reqrow:last-child{border-bottom:none}
.reqrow .nm{flex:1}

.note{font-size:.86em;color:var(--p-dim);line-height:1.5}
.note code{color:var(--p-accent)}
.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);background:var(--p-ink);color:#fff;padding:.7rem 1.2rem;border-radius:980px;font-size:.88em;box-shadow:0 8px 28px rgba(0,0,0,.28);opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

@media(max-width:1100px){.two{grid-template-columns:1fr}.agenda{flex-direction:row;flex-wrap:wrap;padding-top:0}.agenda .box{flex:1 1 15rem}}
@media(max-width:900px){
  .root{--rail-w:4.2rem}
  .rail-who,.rail-name,.rail-role,.navlabel,.rail-foot,.navbtn .lab,.seg{display:none}
  .navbtn{justify-content:center;padding:.6rem 0}
  .rail-user{justify-content:center}
  .main,.crumbs{padding-left:1.1rem;padding-right:1.1rem}
  .crow{grid-template-columns:8rem 1fr 3rem}
}
</style>
</head>
<body>
<div class="root">
  <nav class="rail">
    <div class="rail-user">
      <div class="avatar" id="avatar">SW</div>
      <div class="rail-who"><span class="rail-name" id="uname">SSgt White</span><span class="rail-role" id="urole">Instructor</span></div>
    </div>
    <div class="seg">
      <button id="segInstructor" class="on" onclick="setRole('instructor')">Instructor</button>
      <button id="segStudent" onclick="setRole('student')">Student</button>
    </div>
    <div class="navlabel" id="navlabel">Instructor</div>
    <div id="nav"></div>
    <div class="rail-sp"></div>
    <a class="navbtn rail-foot" href="index.html"><span class="lab">← Overview</span></a>
    <a class="navbtn rail-foot" href="https://github.com/jeranaias"><span class="lab">Open source ↗</span></a>
  </nav>

  <div class="content">
    <div class="crumbs"><span id="crumbRole">SchoolCircle</span><span style="opacity:.5">/</span><span id="crumbView" style="color:var(--p-dim)">Dashboard</span><span class="sp"></span><span>grounded by Anchor · offline-capable</span></div>
    <main class="main"><div class="container" id="stage"></div></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ mock data ============ */
const COURSES = [
  { id:'TC 3-22.9', name:'Rifle & Carbine Marksmanship', school:'28xx · Basic', students:24, mastery:77, week:6, weeks:14, pending:0, weak:'Trigger control', weakPct:61 },
  { id:'MCWP 5-10', name:'Marine Corps Planning Process', school:'06xx · MCPP', students:18, mastery:71, week:3, weeks:9, pending:12, weak:'No-Comms Troubleshooting', weakPct:55 },
];
const TOPICS = [
  { t:'Sight alignment & picture', m:88 },{ t:'Natural point of aim', m:81 },
  { t:'Stable firing positions', m:74 },{ t:'Trigger control', m:61 },{ t:'Ballistics & zeroing', m:58 },
];
const ROSTER = [
  ['Cpl Rivera',82,'+34','mastered 4/5'],['LCpl Doe',68,'+21','developing'],
  ['PFC Nguyen',91,'+40','mastered 5/5'],['LCpl Ahmadi',59,'+12','at risk'],['Cpl Boyd',74,'+28','developing'],
];
const FINDINGS = [
  { sev:'crit', area:'Trigger-control block pacing', mentions:9, s:4.6, h:'long_term', trend:'worsening', note:'Recurs across 3 iterations — the block is too short for the hands-on reps the class needs.' },
  { sev:'warn', area:'Range time vs. classroom', mentions:6, s:3.4, h:'short_term', trend:'flat', note:'Students want the ballistics lecture trimmed in favor of live reps before the block exam.' },
  { sev:'good', area:'Instructor prep & handouts', mentions:11, s:0, h:'sustain', trend:'', note:'Consistently praised — keep the cited one-pagers per lesson.' },
];
const GEN_ITEMS = [
  { kind:'Lesson · OBJ 1', h:'Explain sight alignment and sight picture', txt:'Sight alignment is the relationship between the rear aperture, the front sight post, and the aiming eye — the post centered and level in the aperture. Sight picture places that aligned sight on the target.', cite:'TC 3-22.9, Ch 7 · p.7-3' },
  { kind:'Lesson · OBJ 2', h:'Describe trigger control and follow-through', txt:'A smooth, consistent rearward squeeze so the round leaves the muzzle while the sights are still on target. The most common error is dropping control after the shot.', cite:'TC 3-22.9, Ch 8 · p.8-2' },
  { kind:'Assessment', h:'Knowledge check — 8 items with rationale', txt:'Multiple-choice + written items generated from the objectives, each with an explanation of why the answer is right or wrong.', cite:'grounded in TC 3-22.9 Ch 7–8' },
  { kind:'Scenario', h:'Applied range scenario + coaching', txt:'A live-fire scenario at 300m with branching coaching cues tied to the shooter\'s error — bone support, NPA, trigger reset.', cite:'TC 3-22.9, Ch 6' },
];

/* ============ nav config ============ */
const IC = {
  dash:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/>',
  build:'<path d="m12 3 1.9 4.6L19 9l-4.1 3 1 5-3.9-2.7L8 17l1-5L5 9l5.1-1.4z"/>',
  review:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  rubric:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  chart:'<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="4" width="3" height="14"/>',
  aar:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/>',

function ask(k){const c=document.getElementById('askChat'),d=ASK[k];

  setTimeout(()=>{c.insertAdjacentHTML('beforeend',`<div class="bubble ai ${d.ok?'':'refuse'}"><span class="vbadge ${d.ok?'ok':'mid'}">${d.ok?'✓ Grounded · HHEM verified':'⛔ Refused'}</span><div>${esc(d.a)}</div>${d.c?`<div style="margin-top:.5rem"><span class="cite">${esc(d.c)}</span></div>`:''}</div>`);
    c.scrollIntoView({block:'end'});},450);}
let mscore=40;
function mans(kind){const c=document.getElementById('mChat');
  if(kind==='weak'){c.insertAdjacentHTML('beforeend','<div class="bubble me">You just pull the trigger fast so you don\'t miss the moment.</div>');
    setTimeout(()=>{c.insertAdjacentHTML('beforeend','<div class="bubble ai"><span class="vbadge mid">Developing</span><div>Not quite — speed causes the jerk. What should the squeeze be like, and what happens <i>after</i> the shot breaks?</div></div>');},450);}
  else{c.insertAdjacentHTML('beforeend','<div class="bubble me">A smooth, consistent rearward squeeze isolated to the trigger finger, then follow through — hold it to the rear through recoil until the sear resets so the sights stay on target as the round leaves.</div>');
    setTimeout(()=>{mscore=100;document.getElementById('mastPct').textContent='Mastered · 100%';document.querySelector('#mChat').closest('.container').querySelector('.fill').style.width='100%';document.querySelector('.fill').style.background='var(--p-good)';
      c.insertAdjacentHTML('beforeend','<div class="bubble ai"><span class="vbadge ok">Mastered</span><div>That\'s it — squeeze, isolation, and follow-through all covered. Recorded to your mastery report.</div></div>');toast('Mastery recorded: Trigger control');},450);}
  setTimeout(()=>c.scrollIntoView({block:'end'}),500);}

render();
</script>
